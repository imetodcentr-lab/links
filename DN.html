<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>

    body{
        margin:0;
        padding:30px 15px;
        background:#f1f2f5;
        font-family:'Montserrat', sans-serif;

        display:flex;
        justify-content:center;
    }

    .container{
        width:100%;
        max-width:500px;
    }

    .btn{
        display:block;
        margin:10px 0;
        padding:11px 14px;

        /* Серые объемные кнопки */
        background:linear-gradient(
            to bottom,
            #f2f2f5 0%,
            #d7d7dd 55%,
            #c7c7ce 100%
        );

        color:#5b3b78;

        text-decoration:none;

        font-size:15px;
        font-weight:800;
        letter-spacing:0.4px;
        text-transform:uppercase;

        border-radius:12px;

        text-align:center;

        border:1px solid #bdbdc5;

        /* 3D эффект */
        box-shadow:
            0 4px 0 #b3b3bb,
            0 7px 12px rgba(0,0,0,0.10),
            inset 0 1px 2px rgba(255,255,255,0.9);

        transition:all 0.18s ease;
    }

    .btn:hover{
        background:linear-gradient(
            to bottom,
            #f8f8fa 0%,
            #dfdfe5 55%,
            #d0d0d7 100%
        );

        transform:translateY(2px);

        box-shadow:
            0 2px 0 #b3b3bb,
            0 4px 8px rgba(0,0,0,0.10),
            inset 0 1px 2px rgba(255,255,255,0.9);
    }

</style>
</head>

<body>

<div class="container">

    <a class="btn" href="https://forms.gle/YtVkQWjYDfQVfdph6" target="_blank">
        Дошкільна освіта
    </a>

    <a class="btn" href="https://forms.gle/BEXTQ9fGemZRsn3K8" target="_blank">

    <a class="btn" href="https://forms.gle/JAgXmHqDwTCE7721A" target="_blank">
