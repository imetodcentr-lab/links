<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЦПРІОТС — наші соцмережі</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

    :root {
      --navy: #12123a;
      --navy-2: #1a1a5c;
      --paper: #f4f2ec;
      --gold: #c9a24a;
      --line: rgba(244,242,236,0.14);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    html, body { 
      height: 100%; 
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: radial-gradient(120% 140% at 50% -10%, #2b2b70 0%, #232360 40%, var(--navy) 75%, #08081f 100%);
      color: var(--paper);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(244,242,236,0.06);
      overflow: hidden;
    }

    .mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .mark::after {
      content: '';
      position: absolute;
      inset: -7px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 50%;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 26px;
      line-height: 1.28;
      letter-spacing: 0.2px;
    }

    .eyebrow {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 13.5px;
      color: rgba(244,242,236,0.55);
      margin-top: 10px;
      letter-spacing: 0.2px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 17px 18px;
      background: rgba(244,242,236,0.04);
      border: 1px solid var(--line);
      border-radius: 14px;
      text-decoration: none;
      color: var(--paper);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .link-card:hover {
      background: rgba(244,242,236,0.08);
      border-color: rgba(201,162,74,0.45);
      transform: translateY(-2px);
    }

    .link-card:active { 
      transform: translateY(0px) scale(0.99); 
    }

    .icon {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg { 
      width: 21px; 
      height: 21px; 
    }

    .icon.ig { background: linear-gradient(135deg,#f9ce34,#ee2a7b 45%,#6228d7); }
    .icon.fb { background: #1877F2; }
    .icon.yt { background: #FF0000; }
    .icon.site { background: var(--gold); }

    .txt { 
      flex: 1; 
      min-width: 0; 
    }

    .txt .name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.1px;
    }

    .txt .handle {
      font-size: 12.5px;
      color: rgba(244,242,236,0.5);
      margin-top: 2px;
    }

    .arrow {
      color: rgba(244,242,236,0.35);
      font-size: 18px;
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 11.5px;
      color: rgba(244,242,236,0.35);
      letter-spacing: 0.3px;
      line-height: 1.6;
    }

    footer b { 
      color: rgba(244,242,236,0.55); 
    }

    @media (prefers-reduced-motion: reduce) {
      .link-card { transition: none; }
    }
  </style>
</head>
